<main class="shell">
  <h1>TUT Vision</h1>

  @if (account(); as username) {
    <p class="who">Signed in as {{ username }}</p>
    <button class="ghost" (click)="signOut()">Sign out</button>
  } @else {
    <button (click)="signIn()" [disabled]="busy()">
      {{ busy() ? 'Working…' : 'Sign in with Microsoft' }}
    </button>
  }

  @if (error(); as message) {
    <p class="error">{{ message }}</p>
  }

  @if (userId(); as uid) {
    @if (isStaff()) {
      <app-status-control [userId]="uid" (changed)="refreshDashboard()" />
      <app-schedule-editor [userId]="uid" />
    }
  }

  @if (departmentId(); as deptId) {
    <app-dashboard [departmentId]="deptId" />
  }
</main>

<router-outlet />
